<style>

  .karte{position:relative;z-index:1;width:min(560px,100%);text-align:center;padding:8px 22px 22px}
  .buehne{position:relative;width:260px;height:220px;margin:0 auto -4px}

  .karte>*{animation:auf .9s cubic-bezier(.2,.8,.2,1) both}

  #toast{position:fixed;top:84px;left:50%;transform:translate(-50%,-20px);opacity:0;z-index:15;background:linear-gradient(90deg,rgba(255,213,74,.95),rgba(255,160,90,.95));color:#1d1300;font-weight:800;font-size:18px;padding:12px 22px;border-radius:99px;transition:all .4s;pointer-events:none;text-align:center;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.45)}

  #countdown{position:fixed;inset:0;display:grid;place-items:center;font-size:160px;font-weight:900;z-index:21;pointer-events:none;color:var(--gelb);text-shadow:0 0 40px rgba(255,213,74,.7)}
  #abzeichen{display:flex;gap:6px;font-size:22px}

</style>

let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==="suspended") AC.resume(); return AC; }
function ton(f1, f2, dauer, typ="sine", laut=.12, wann=0){
  if(!S.ton) return; const a=ac(); if(!a) return;
  const t=a.currentTime+wann, o=a.createOscillator(), g=a.createGain();
  o.type=typ; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dauer);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(laut,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dauer);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dauer+.05);
}
function rauschen(dauer, von, bis, laut=.09){
  if(!S.ton) return; const a=ac(); if(!a) return;
  const n=a.sampleRate*dauer, buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const src=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(), t=a.currentTime;
  src.buffer=buf; f.type="bandpass"; f.Q.value=1.2;
  f.frequency.setValueAtTime(von,t); f.frequency.exponentialRampToValueAtTime(bis,t+dauer);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(laut,t+dauer*.3); g.gain.linearRampToValueAtTime(0,t+dauer);
  src.connect(f).connect(g).connect(a.destination); src.start(t);
}

function welt2bild(x,y,tiefe=1){ return [ (x-kam.x)*tiefe + BW/2, (y-kam.y)*tiefe + BH/2 ]; }
function bild2welt(px,py){ return [ px - BW/2 + kam.x, py - BH/2 + kam.y ]; }

function planetMalen(p, t){
  const [x,y] = welt2bild(p.x,p.y);
  if(x<-p.r*3.2||x>BW+p.r*3.2||y<-p.r*3.2||y>BH+p.r*3.2) return;
  const besucht = !!S.planeten[p.id];
  // 3D-Atmosphären-Leuchten (unbesuchte pulsieren kräftiger)
  const puls = besucht ? .32 : .45+.22*Math.sin(t/480+p.x);
  const gl = cx.createRadialGradient(x,y,p.r*.55,x,y,p.r*2.25);
  gl.addColorStop(0, p.a+"88"); gl.addColorStop(.55, p.b+"44"); gl.addColorStop(1, "transparent");
  cx.globalAlpha = puls*1.5; cx.fillStyle=gl; cx.beginPath(); cx.arc(x,y,p.r*2.25,0,7); cx.fill(); cx.globalAlpha=1;

  // Planetenring hinten
  if(p.ring){
    cx.save(); cx.translate(x,y); cx.rotate(-.35);
    cx.strokeStyle=p.a+"88"; cx.lineWidth=11; cx.beginPath(); cx.ellipse(0,0,p.r*1.68,p.r*.44,0,Math.PI,2*Math.PI); cx.stroke();
    cx.strokeStyle="#ffffff66"; cx.lineWidth=2.5; cx.beginPath(); cx.ellipse(0,0,p.r*1.68,p.r*.44,0,Math.PI,2*Math.PI); cx.stroke();
    cx.restore();
  }

  // Raumstation: rotierender 3D-Außenring mit Leuchtspeichen
  if(p.station){
    cx.save(); cx.translate(x,y); cx.rotate(t/3800);
    cx.strokeStyle=p.b; cx.lineWidth=12; cx.beginPath(); cx.arc(0,0,p.r*1.06,0,7); cx.stroke();
    cx.strokeStyle=p.a; cx.lineWidth=6; cx.beginPath(); cx.arc(0,0,p.r*1.06,0,7); cx.stroke();
    cx.lineWidth=5;
    for(let k=0;k<4;k++){
      cx.rotate(Math.PI/2);
      cx.beginPath(); cx.moveTo(0,0); cx.lineTo(p.r*1.06,0); cx.stroke();
      cx.fillStyle="#fff"; cx.beginPath(); cx.arc(p.r*1.06,0,3.5,0,7); cx.fill();
    }
    cx.restore();
  }

  // 3D-Sphäre mit eingebettetem Stations-Kunstwerk
  const rKugel = p.station ? p.r*.78 : p.r;
  const img = BILD_CACHE[p.bild];
  cx.save();
  cx.beginPath(); cx.arc(x,y,rKugel,0,7); cx.clip();
  if(img && img.complete && img.naturalWidth > 0){
    const sw = img.naturalHeight, sx = (img.naturalWidth - sw)/2;
    const zoom = 1.08 + Math.sin(t/2800 + p.x)*0.03;
    const d = rKugel*2*zoom;
    cx.drawImage(img, sx, 0, sw, sw, x - d/2, y - d/2, d, d);
  } else {
    const k = cx.createRadialGradient(x-rKugel*.38,y-rKugel*.42,rKugel*.1,x,y,rKugel);
    k.addColorStop(0,"#ffffff"); k.addColorStop(.22,p.a); k.addColorStop(1,p.b);
    cx.fillStyle=k; cx.fillRect(x-rKugel,y-rKugel,rKugel*2,rKugel*2);
  }
  // 3D-Kugel-Schattierung & Glanzlicht darüber
  const schatten = cx.createRadialGradient(x-rKugel*.35,y-rKugel*.38,rKugel*.15,x+rKugel*.2,y+rKugel*.25,rKugel*1.25);
  schatten.addColorStop(0,"rgba(255,255,255,.32)");
  schatten.addColorStop(.38,"rgba(255,255,255,0)");
  schatten.addColorStop(.78,"rgba(6,10,28,.35)");
  schatten.addColorStop(1,"rgba(4,6,20,.78)");
  cx.fillStyle=schatten; cx.fillRect(x-rKugel,y-rKugel,rKugel*2,rKugel*2);
  cx.restore();

  // Leuchtender 3D-Planetenrand
  cx.save();
  cx.strokeStyle=p.a; cx.lineWidth=3.2;
  cx.shadowColor=p.a; cx.shadowBlur=14;
  cx.beginPath(); cx.arc(x,y,rKugel,0,7); cx.stroke();
  cx.shadowBlur=0;
  cx.strokeStyle="rgba(255,255,255,.55)"; cx.lineWidth=1.2;
  cx.beginPath(); cx.arc(x,y,rKugel-1.5,-.8*Math.PI,-.15*Math.PI); cx.stroke();
  cx.restore();

  // Planetenring vorne
  if(p.ring){
    cx.save(); cx.translate(x,y); cx.rotate(-.35);
    cx.strokeStyle=p.a; cx.lineWidth=10; cx.beginPath(); cx.ellipse(0,0,p.r*1.68,p.r*.44,0,0,Math.PI); cx.stroke();
    cx.strokeStyle="#ffffffaa"; cx.lineWidth=2.5; cx.beginPath(); cx.ellipse(0,0,p.r*1.68,p.r*.44,0,0,Math.PI); cx.stroke();
    cx.restore();
  }

  // Name & kleines Emoji-Schild unter dem Planeten
  const labelY = y + p.r + (p.ring ? 30 : 24);
  const labelText = (p.zu ? "🔒 " : p.e + " ") + p.n;
  cx.font = "800 16px system-ui, sans-serif";
  const tw = cx.measureText(labelText).width;
  const pw = tw + 24, ph = 28;
  cx.save();
  cx.fillStyle = "rgba(8,14,38,.82)";
  cx.strokeStyle = besucht ? "rgba(94,240,192,.7)" : p.a+"99";
  cx.lineWidth = 1.6;
  cx.beginPath();
  if(cx.roundRect) cx.roundRect(x - pw/2, labelY - ph/2, pw, ph, 14);
  else cx.rect(x - pw/2, labelY - ph/2, pw, ph);
  cx.fill(); cx.stroke();
  cx.fillStyle = "#f5f8ff"; cx.textAlign="center"; cx.textBaseline="middle";
  cx.fillText(labelText, x, labelY + 1);
  cx.restore();

  if(besucht){
    const fx = x + rKugel*.74, fy = y - rKugel*.74;
    cx.save();
    cx.fillStyle="rgba(12,22,54,.92)"; cx.strokeStyle="#5ef0c0"; cx.lineWidth=2;
    cx.beginPath(); cx.arc(fx,fy,15,0,7); cx.fill(); cx.stroke();
    cx.font="16px system-ui"; cx.textAlign="center"; cx.textBaseline="middle";
    cx.fillText("🚩", fx, fy+1);
    cx.restore();
  }
}

function malen(t){

  const hg=cx.createLinearGradient(0,0,0,BH); hg.addColorStop(0,"#0a1030"); hg.addColorStop(1,"#05081a");
  cx.fillStyle=hg; cx.fillRect(0,0,BW,BH);

  for(const L of SCHICHTEN){ cx.fillStyle="#fff"; for(const s of L.sterne){ const [x,y]=welt2bild(s.x,s.y,L.tiefe); if(x<-5||x>BW+5||y<-5||y>BH+5) continue; cx.globalAlpha=.45+.55*Math.abs(Math.sin(t/1200+s.p)); cx.beginPath(); cx.arc(x,y,s.r,0,7); cx.fill(); } }

  if(warp>0){ cx.strokeStyle="rgba(255,255,255,.7)"; cx.lineWidth=2; for(const L of SCHICHTEN) for(let i=0;i<L.sterne.length;i+=3){ const s=L.sterne[i]; const [x,y]=welt2bild(s.x,s.y,L.tiefe); const dx=x-BW/2, dy=y-BH/2; cx.globalAlpha=warp*.8; cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x+dx*warp*.5,y+dy*warp*.5); cx.stroke(); } cx.globalAlpha=1; }
  // Sternschnuppen
  for(const s of schnuppen){ const [x,y]=welt2bild(s.x,s.y); const g=cx.createLinearGradient(x,y,x-s.vx*14,y-s.vy*14); g.addColorStop(0,"#fff"); g.addColorStop(1,"rgba(255,255,255,0)"); cx.strokeStyle=g; cx.lineWidth=3; cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x-s.vx*14,y-s.vy*14); cx.stroke(); cx.fillStyle="#fff8c8"; cx.beginPath(); cx.arc(x,y,4,0,7); cx.fill(); }
  for(const p of PLANETEN) planetMalen(p,t);
  ufoMalen(t);
  for(const f of funken){ const [x,y]=welt2bild(f.x,f.y); cx.globalAlpha=Math.max(0,f.l); cx.fillStyle=f.c; cx.font=`${f.s}px system-ui`; cx.fillText("✦",x,y); }
  cx.globalAlpha=1;
  miniKarte();
}

function miniKarte(){
  const w=Math.min(190,BW*.22), h=w*WELT.h/WELT.w, x0=BW-w-14, y0=BH-h-14, f=w/WELT.w;
  cx.fillStyle="rgba(10,16,48,.76)"; cx.strokeStyle="rgba(160,185,255,.4)"; cx.lineWidth=1.5;
  cx.beginPath(); cx.roundRect ? cx.roundRect(x0,y0,w,h,12) : cx.rect(x0,y0,w,h); cx.fill(); cx.stroke();
  for(const p of PLANETEN){ cx.fillStyle = S.planeten[p.id] ? p.a : "rgba(255,255,255,.55)"; cx.beginPath(); cx.arc(x0+p.x*f, y0+p.y*f, Math.max(3,p.r*f), 0, 7); cx.fill(); }
  cx.strokeStyle="rgba(255,255,255,.65)"; cx.lineWidth=1; cx.strokeRect(x0+(kam.x-BW/2)*f, y0+(kam.y-BH/2)*f, BW*f, BH*f);
  cx.fillStyle=S.farbe; cx.beginPath(); cx.arc(x0+ufo.x*f, y0+ufo.y*f, 4.5, 0, 7); cx.fill();
  miniKarte.box={x0,y0,w,h,f};
}

/* ---------- Bewegung ---------- */
let warp=0, letzte=0, gelandet=null, pausiert=false;
window.sternenstaubPause = () => { pausiert=true; };
window.sternenstaubWeiter = () => { if(pausiert){ pausiert=false; letzte=0; requestAnimationFrame(schritt); } };
window.addEventListener("message", e => {
  if(e.data === "pause") window.sternenstaubPause();
  else if(e.data === "weiter") window.sternenstaubWeiter();
});
function schritt(t){
  if(pausiert) return;
  const dt=Math.min(50,t-(letzte||t)); letzte=t;
  // UFO-Flug (weiche Kurve)
  if(ufo.flug){
    const F=ufo.flug; F.k=Math.min(1,F.k+dt/F.dauer);
    const e=F.k<.5 ? 4*F.k*F.k*F.k : 1-Math.pow(-2*F.k+2,3)/2;
    const mx=(F.x0+F.x1)/2, my=Math.min(F.y0,F.y1)-160;
    ufo.x=(1-e)*(1-e)*F.x0+2*(1-e)*e*mx+e*e*F.x1; ufo.y=(1-e)*(1-e)*F.y0+2*(1-e)*e*my+e*e*F.y1;
    if(Math.random()<.5) funken.push({x:ufo.x+zufall(-20,20),y:ufo.y+12,l:1,s:zufall(8,14),c:S.farbe});
    if(F.k>=1){ ufo.flug=null; F.fertig && F.fertig(); }
  }
  if(ufo.beam>0 && !ufo.beamAn) ufo.beam=Math.max(0,ufo.beam-dt/400);
  if(ufo.beamAn) ufo.beam=Math.min(1,ufo.beam+dt/350);
  // Kamera
  if(kam.folgen){ kam.zx=ufo.x; kam.zy=ufo.y+60;
    if(gelandet && fenster.classList.contains("auf")){ kam.zx=gelandet.x; kam.zy=gelandet.y+BH*.2; } }
  kam.zx=Math.max(BW/2-300,Math.min(WELT.w-BW/2+300,kam.zx)); kam.zy=Math.max(BH/2-300,Math.min(WELT.h-BH/2+300,kam.zy));
  kam.x+=(kam.zx-kam.x)*Math.min(1,dt/180); kam.y+=(kam.zy-kam.y)*Math.min(1,dt/180);
  // Funken & Schnuppen
  for(let i=funken.length-1;i>=0;i--){ const f=funken[i]; f.l-=dt/700; f.y+=dt*.02; if(f.l<=0) funken.splice(i,1); }
  if(!reduziert && schnuppen.length<1 && Math.random()<dt/9000){ const [wx,wy]=bild2welt(zufall(0,BW),zufall(0,BH*.4)); schnuppen.push({x:wx,y:wy,vx:zufall(3,6)*(Math.random()<.5?-1:1),vy:zufall(1.5,3),l:2200}); }
  for(let i=schnuppen.length-1;i>=0;i--){ const s=schnuppen[i]; s.x+=s.vx*dt/16; s.y+=s.vy*dt/16; s.l-=dt; if(s.l<=0) schnuppen.splice(i,1); }
  if(warp>0) warp=Math.max(0,warp-dt/1400);
  malen(t);
  requestAnimationFrame(schritt);
}

function fliegeZu(p){
  schliessen(true); gelandet=null;
  const zx=p.x, zy=p.y-p.r-70;
  const dist=Math.hypot(zx-ufo.x, zy-ufo.y);
  if(dist<20){ landen(p); return; }
  kam.folgen=true; klang.flug();
  ufo.zx=zx; ufo.zy=zy;
  ufo.flug={x0:ufo.x,y0:ufo.y,x1:zx,y1:zy,k:0,dauer:reduziert?300:Math.max(700,Math.min(1900,dist*1.4)),fertig:()=>landen(p)};
  tippWeg();
}
function landen(p){
  gelandet=p;
  S.ufo={x:ufo.x,y:ufo.y}; merken();
  ufo.beamAn=true; klang.beam();
  setTimeout(()=>{ ufo.beamAn=false;
    if(!S.planeten[p.id] && !p.zu){ S.planeten[p.id]=true; staubDazu(3, p); pruefeAbzeichen(); }
    oeffnen(p);
  }, 520);
}

/* ---------- Sternenstaub & Abzeichen ---------- */
function staubDazu(n, wo){
  S.staub+=n; merken(); document.getElementById("zahl").textContent=S.staub;
  const el=document.getElementById("staub"); el.classList.remove("plopp"); void el.offsetWidth; el.classList.add("plopp");
  klang.ding();
  if(wo) for(let i=0;i<24;i++) funken.push({x:wo.x+zufall(-wo.r,wo.r),y:wo.y+zufall(-wo.r,wo.r),l:zufall(.8,1.4),s:zufall(12,22),c:"#ffd54a"});
  toast(`+${n} ✨ Sternenstaub!`);
}
function pruefeAbzeichen(){
  const n=Object.keys(S.planeten).length;
  for(const a of ABZEICHEN) if(n===a.n){ setTimeout(()=>{ klang.fanfare(); toast(`${a.e} Abzeichen: ${a.t}!`, 3200); },900); }
  abzeichenZeigen();
}
function abzeichenZeigen(){
  const n=Object.keys(S.planeten).length; const hab=ABZEICHEN.filter(a=>n>=a.n).map(a=>a.e).join("");
  document.getElementById("pname").innerHTML = (S.name||"Pilot") + (hab?` <span style="margin-left:4px">${hab}</span>`:"");
}
let toastT=0;
function toast(t, ms=1800){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("zeig"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("zeig"), ms); }

/* ---------- Planeten-Fenster (mit 3D-Stationskarten) ---------- */
const fenster=document.getElementById("fenster");
function oeffnen(p){
  const fE = document.getElementById("fE");
  const pBild = STATION_BILDER[p.bild];
  if(pBild){
    fE.style.backgroundImage = `url(${pBild})`;
    fE.style.borderColor = p.a;
    fE.innerHTML = `<span class="mini-e">${p.zu?"🔒":p.e}</span>`;
  } else {
    fE.style.backgroundImage = "none";
    fE.textContent = p.zu?"🔒":p.e;
  }
  document.getElementById("fT").textContent=p.n;
  document.getElementById("fI").textContent=p.i;
  fenster.classList.toggle("einzeln", !p.s || p.s.length <= 1);
  const box=document.getElementById("fS"); box.innerHTML="";
  if(p.zu){ box.innerHTML='<div class="station" style="cursor:default"><div class="station-top"><div class="e">🚧</div></div><div class="station-body"><b>Baustelle</b><span>Komm bald wieder vorbei!</span></div></div>'; }
  for(const s of p.s){
    const b=document.createElement("button"); b.className="station";
    const sBild = STATION_BILDER[s.bild || p.bild];
    if(sBild) b.style.backgroundImage = `url(${sBild})`;
    b.style.borderColor = p.a + "77";
    const da=!!S.stationen[s.u];
    b.innerHTML=`<div class="station-top"><div class="e">${s.e}</div><div class="haken ${da?"da":""}">${da?"✅ Erkundet":"🚀 Starten"}</div></div><div class="station-body"><b></b><span></span></div>`;
    b.querySelector("b").textContent=s.t; b.querySelector("span").textContent=s.i;
    b.onclick=()=>{ klang.tipp(); if(!S.stationen[s.u]){ S.stationen[s.u]=true; S.staub+=1; document.getElementById("zahl").textContent=S.staub; } S.ufo={x:ufo.x,y:ufo.y}; merken(); setTimeout(()=>{ if(window.parent && window.parent !== window){ window.parent.postMessage({ufo21:"station", titel:s.t, url:s.u},"*"); } else { window.oeffneEigenStation(s.t, s.u); } },120); };
    box.appendChild(b);
  }
  fenster.classList.add("auf");
}
function schliessen(still){ fenster.classList.remove("auf"); if(!still) klang.tipp(); }
document.getElementById("zu").onclick=()=>schliessen();

/* ---------- Bedienung: wischen & tippen ---------- */
let zug=null;
cv.addEventListener("pointerdown", e=>{ ac(); zug={x:e.clientX,y:e.clientY,kx:kam.x,ky:kam.y,weit:0}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e=>{ if(!zug) return; const dx=e.clientX-zug.x, dy=e.clientY-zug.y; zug.weit=Math.max(zug.weit,Math.hypot(dx,dy)); if(zug.weit>8){ kam.folgen=false; kam.zx=zug.kx-dx; kam.zy=zug.ky-dy; kam.x=kam.zx; kam.y=kam.zy; tippWeg(); } });
cv.addEventListener("pointerup", e=>{ if(!zug) return; const kurz=zug.weit<=8; zug=null; if(kurz) tippen(e.clientX,e.clientY); });
function tippen(px,py){
  // Minikarte
  const m=miniKarte.box; if(m && px>=m.x0 && px<=m.x0+m.w && py>=m.y0 && py<=m.y0+m.h){ const wx=(px-m.x0)/m.f, wy=(py-m.y0)/m.f; let best=null,bd=1e9; for(const p of PLANETEN){ const d=Math.hypot(p.x-wx,p.y-wy); if(d<bd){bd=d;best=p;} } if(best) fliegeZu(best); return; }
  const [wx,wy]=bild2welt(px,py);
  // Sternschnuppe fangen (mit dem UFO anfliegen, wenn in Reichweite!)
  for(let i=0;i<schnuppen.length;i++){
    const s=schnuppen[i];
    if(Math.hypot(s.x-wx,s.y-wy)<85){
      const distUfo = Math.hypot(s.x-ufo.x, s.y-ufo.y);
      if(distUfo > 720){
        klang.flug();
        ufo.flug={x0:ufo.x,y0:ufo.y,x1:ufo.x+(s.x-ufo.x)*.55,y1:ufo.y+(s.y-ufo.y)*.55,k:0,dauer:550};
        toast("🌠 Sternschnuppe war zu weit weg – flieg näher ran!");
        return;
      }
      const zielX = s.x + s.vx*10, zielY = s.y + s.vy*10;
      schnuppen.splice(i,1);
      klang.flug();
      ufo.flug={x0:ufo.x,y0:ufo.y,x1:zielX,y1:zielY,k:0,dauer:Math.max(240,Math.min(520,distUfo*.85)),fertig:()=>{
        staubDazu(5,{x:zielX,y:zielY,r:36});
        toast("🌠 Dein UFO hat die Sternschnuppe im Flug gefangen! +5 ✨");
      }};
      return;
    }
  }
  for(const p of PLANETEN){ if(Math.hypot(p.x-wx,p.y-wy)<p.r*1.25){ klang.tipp(); fliegeZu(p); return; } }
  if(fenster.classList.contains("auf")) schliessen();
}
let tippZeit=setTimeout(tippWeg, 9000);
function tippWeg(){ document.getElementById("tipp").style.opacity=0; }

/* ---------- Ton-Knopf ---------- */
const tonK=document.getElementById("ton");
const tonZeigen=()=>tonK.textContent=S.ton?"🔊":"🔇";
tonK.onclick=()=>{ S.ton=!S.ton; merken(); tonZeigen(); if(S.ton){ ac(); klang.tipp(); } }; tonZeigen();

/* ---------- Start ---------- */
document.getElementById("zahl").textContent=S.staub; abzeichenZeigen();
const sF=document.getElementById("sF");
UFO_FARBEN.forEach(f=>{ const d=document.createElement("div"); d.className="farbe"+(f===S.farbe?" an":""); d.style.background=f; d.style.color=f; d.onclick=()=>{ S.farbe=f; document.getElementById("start").style.setProperty("--ufo",f); [...sF.children].forEach(c=>c.classList.toggle("an",c===d)); ac(); klang.tipp(); }; sF.appendChild(d); });
if(S.farbe) document.getElementById("start").style.setProperty("--ufo",S.farbe);
const sName=document.getElementById("sName"); sName.value=S.name||"";
if(S.name){ document.getElementById("sT").textContent=`Willkommen zurück, ${S.name}!`; document.getElementById("sP").innerHTML="Dein UFO ist startklar.<br>Name oder Farbe ändern? Einfach hier."; }
document.getElementById("sLos").onclick=()=>{
  try{ sessionStorage.setItem("an-bord","1"); }catch(e){}
  ac(); S.name=(sName.value||"").trim().slice(0,16)||"Pilot"; merken(); abzeichenZeigen();
  document.getElementById("start").classList.add("weg"); sName.blur();
  const cd=document.getElementById("countdown");
  if(reduziert){ cd.remove(); return; }
  let n=3; const zaehl=()=>{ if(n>0){ cd.textContent=n; ton(440,440,.15,"square",.06); n--; setTimeout(zaehl,520); } else { cd.textContent="🚀"; klang.flug(); warp=1; ton(200,1200,.9,"sawtooth",.05); setTimeout(()=>{ cd.textContent=""; toast(`Los geht's, ${S.name}! 🛸`, 2200); },600); } };
  zaehl();
};
// Zurück von einer Station: direkt im Weltall weiter, ohne Startbildschirm
let anBord=false; try{ anBord=sessionStorage.getItem("an-bord")==="1"; }catch(e){}
if(anBord){ document.getElementById("start").remove(); document.getElementById("countdown").textContent=""; tippWeg(); toast(`Willkommen zurück, ${S.name||"Pilot"}! ✨`); }
// Piloten-Schild antippen: Name & Farbe ändern
document.getElementById("pilot").onclick=()=>{ klang.tipp(); let st=document.getElementById("start"); if(st){ st.classList.remove("weg"); return; } try{ sessionStorage.removeItem("an-bord"); }catch(e){} location.reload(); };
sName.addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("sLos").click(); });
requestAnimationFrame(schritt);
</script>
